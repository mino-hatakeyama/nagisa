<html lang="ja">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="足踏みで沖縄の浜辺を歩く3Dウォーキング">
<title>渚をあるく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ink:#fbf8f1;
    --ink-dim:rgba(251,248,241,.8);
    --glass:rgba(10,52,70,.34);
    --line:rgba(251,248,241,.42);
    --sun:#ffe08a;
    --deep:#0a3346;
    --ui:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --display:"Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);overflow:hidden;font-family:var(--ui)}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;filter:contrast(1.16) saturate(1.18)}
  #stage canvas:active{cursor:grabbing}

  .hud{position:fixed;left:0;right:0;pointer-events:none;z-index:5}
  .hud-top{top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0}
  .meter{display:grid;gap:6px;font-size:13px;letter-spacing:.06em;color:var(--ink-dim);font-variant-numeric:tabular-nums;
    text-shadow:0 1px 8px rgba(0,40,60,.55)}
  .meter b{font-weight:500;color:var(--ink);font-size:18px;margin-right:2px}
  .meter .row{display:flex;flex-wrap:wrap;gap:4px 14px}
  .meter .seen b{font-size:15px}
  .meter .jet{opacity:.9}
  .meter .jet b{font-variant-numeric:tabular-nums}
  .mute{pointer-events:auto;font:500 12px/1 var(--ui);letter-spacing:.08em;color:var(--ink);
    background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .mute:focus-visible,.key:focus-visible,.go:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

  .hud-bottom{bottom:0;display:flex;justify-content:center;gap:18px;
    padding:0 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
  .key{pointer-events:auto;position:relative;width:60px;height:100px;padding:0;border:0;background:none;
    color:var(--ink);font:700 22px/1 var(--ui);cursor:pointer;display:block;
    transition:transform .08s;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .key svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:filter .2s}
  .key#keyL svg{transform:scaleX(-1)}
  .key svg *{fill:rgba(8,48,66,.46);stroke:rgba(251,248,241,.6);stroke-width:1.6;transition:fill .15s, stroke .2s}
  .key .lbl{position:absolute;left:0;right:0;top:48%;display:grid;justify-items:center;gap:4px;text-shadow:0 1px 6px rgba(0,30,45,.6)}
  .key small{font:500 10px/1 var(--ui);letter-spacing:.12em;color:var(--ink-dim)}
  .key.next svg{filter:drop-shadow(0 0 7px rgba(255,224,138,.7))}
  .key.next svg *{stroke:rgba(255,224,138,.95)}
  .key.down{transform:translateY(3px)}
  .key.down svg *{fill:rgba(255,224,138,.32)}
  /* night: pale-blue, dimmer footprint keys */
  body.night .key svg *{fill:rgba(6,16,32,.42);stroke:rgba(170,200,240,.32)}
  body.night .key .lbl{color:rgba(205,222,250,.55);text-shadow:none}
  body.night .key small{color:rgba(205,222,250,.45)}
  body.night .key.next svg{filter:drop-shadow(0 0 5px rgba(150,190,255,.35))}
  body.night .key.next svg *{stroke:rgba(175,205,250,.62)}
  body.night .key.down svg *{fill:rgba(150,190,255,.16)}
  .key.miss{animation:shake .28s}
  .hud-bottom{transition:opacity 1.2s ease}
  .hud-bottom.idle{opacity:0}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .toast{position:fixed;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.06em;color:var(--ink);
    background:var(--glass);border:1px solid var(--line);padding:7px 14px;border-radius:999px;opacity:0;
    transition:opacity .35s;pointer-events:none;z-index:6;white-space:nowrap;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .toast.on{opacity:1}
  #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  #meet{top:calc(env(safe-area-inset-top,0px) + 64px);font-size:14px;padding:9px 18px}
  #stairwell{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;display:grid;place-items:center;
    background:radial-gradient(ellipse at 50% 40%,#5d5649 0%,#2b2721 70%,#1a1714 100%)}
  #stairwell span{font-size:15px;letter-spacing:.2em;color:rgba(251,248,241,.8)}

  @media (pointer:coarse){
    .hud-bottom{justify-content:space-between;padding-inline:22px}
    .key{width:72px;height:120px;font-size:26px}
  }

  #intro{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;overflow-y:auto;padding-top:16px;
    background:linear-gradient(180deg,rgba(4,40,58,0) 35%,rgba(4,40,58,.7) 100%);
    padding:0 16px calc(env(safe-area-inset-bottom,0px) + 40px);transition:opacity .9s}
  #intro.gone{opacity:0;pointer-events:none}
  .intro-in{margin-top:auto;max-width:580px;margin-left:clamp(0px,5vw,64px);display:grid;gap:18px}
  .eyebrow{font-size:12px;letter-spacing:.32em;color:var(--sun)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,9vw,84px);line-height:1;margin:0;
    letter-spacing:.06em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,40,60,.45)}
  .lede{margin:0;font-size:15px;line-height:1.8;color:var(--ink-dim);max-width:34em}
  .how{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:var(--ink-dim);align-items:center}
  .how kbd{display:inline-block;min-width:26px;text-align:center;font:700 13px/26px var(--ui);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;background:var(--glass);margin-right:4px}
  .opts{display:grid;gap:12px;max-width:560px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{display:grid;gap:5px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--glass);color:var(--ink);cursor:pointer;font-family:var(--ui);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s, background .2s}
  .mode b{font-size:15px;font-weight:700;letter-spacing:.06em}
  .mode span{font-size:12px;line-height:1.6;color:var(--ink-dim)}
  .mode[aria-checked="true"]{border-color:var(--sun);background:rgba(255,224,138,.16);box-shadow:0 0 0 1px rgba(255,224,138,.45)}
  .mode:focus-visible,.alt input:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
  .times{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .times .tl{font-size:13px;color:var(--ink-dim);margin-right:4px}
  .time{font:500 13px/1 var(--ui);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;
    padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .time[aria-checked="true"]{border-color:var(--sun);background:rgba(255,224,138,.18);box-shadow:0 0 0 1px rgba(255,224,138,.45)}
  .time:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
  .alt{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);cursor:pointer;user-select:none}
  .alt input{width:18px;height:18px;accent-color:#ffe08a;margin:0}
  .alt small{color:var(--ink-dim);font-size:12px}
  @media (max-width:520px){.modes{grid-template-columns:1fr}}
  .go{justify-self:start;font:700 15px/1 var(--ui);letter-spacing:.14em;color:#2a1d02;background:var(--sun);
    border:0;border-radius:999px;padding:15px 30px;cursor:pointer;box-shadow:0 6px 30px rgba(255,224,138,.35)}
  .go:hover{filter:brightness(1.06)}
  .go[disabled]{opacity:.5;cursor:progress}
  #err[hidden]{display:none}
  #err{position:fixed;inset:0;display:grid;place-items:center;padding:0 16px;text-align:center;z-index:20;background:var(--deep)}
</style>

</head>
<body>
<div id="stage"></div>

<div class="hud hud-top">
  <div class="meter" aria-live="polite">
    <div class="row"><span><b id="steps">0</b> 歩</span><span><b id="dist">0.0</b> m</span><span class="jet">次の飛行機 <b id="jetEta">--:--</b></span></div>
    <div class="row seen"><span>カニ <b id="cCrab">0</b></span><span>ヤドカリ <b id="cHermit">0</b></span><span>鳥 <b id="cBird">0</b></span><span>浜昼顔 <b id="cFlower">0</b></span><span>小魚 <b id="cFish">0</b></span></div>
  </div>
  <button class="mute" id="mute" type="button">音あり</button>
</div>
<div class="hud hud-bottom" id="hudBottom">
  <button class="key" id="keyK" type="button" aria-label="左足 J"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M30 97C19 97 13 88 13.5 76C14 65 9.5 57 9 46C8.5 35 15 28.5 27 28C40 27.5 50.5 33 50.5 45C50.5 55 42.5 62 42.5 75C42.5 88 40 97 30 97Z"/><ellipse cx="43.5" cy="16.5" rx="7" ry="9"/><ellipse cx="32.5" cy="11.5" rx="4.6" ry="5.8"/><ellipse cx="23.8" cy="12.8" rx="4" ry="5.1"/><ellipse cx="16.4" cy="16.8" rx="3.5" ry="4.5"/><ellipse cx="10.4" cy="22.8" rx="3" ry="3.9"/></svg><span class="lbl"><span>J</span><small>左足</small></span></button>
  <button class="key" id="keyL" type="button" aria-label="右足 K"><svg viewBox="0 0 60 100" aria-hidden="true"><path d="M30 97C19 97 13 88 13.5 76C14 65 9.5 57 9 46C8.5 35 15 28.5 27 28C40 27.5 50.5 33 50.5 45C50.5 55 42.5 62 42.5 75C42.5 88 40 97 30 97Z"/><ellipse cx="43.5" cy="16.5" rx="7" ry="9"/><ellipse cx="32.5" cy="11.5" rx="4.6" ry="5.8"/><ellipse cx="23.8" cy="12.8" rx="4" ry="5.1"/><ellipse cx="16.4" cy="16.8" rx="3.5" ry="4.5"/><ellipse cx="10.4" cy="22.8" rx="3" ry="3.9"/></svg><span class="lbl"><span>K</span><small>右足</small></span></button>
</div>
<div class="toast" id="toast">J と K を交互に</div>
<div class="toast" id="meet"></div>
<div id="stairwell" aria-hidden="true"><span id="stairText">塔の中の階段をのぼる</span></div>

<div id="intro">
  <div class="intro-in">
    <div class="eyebrow">南の島 ・ 白い砂浜と珊瑚礁の海</div>
    <h1>渚をあるく</h1>
    <p class="lede">透きとおった遠浅の海と、緑におおわれた砂山にはさまれた浜を、どこまでも。カニやヤドカリ、浜の鳥、浜昼顔の花に出会えるかもしれません。</p>
    <div class="opts">
      <div class="modes" role="radiogroup" aria-label="あそびかた">
        <button class="mode" type="button" role="radio" aria-checked="true" data-mode="normal" id="modeNormal"><b>ノーマルモード</b><span>ドラッグや ←→ で向きを変えながら、自由に歩く</span></button>
        <button class="mode" type="button" role="radio" aria-checked="false" data-mode="auto" id="modeAuto"><b>自動ルートモード</b><span>浜辺のルートを自動で進む。手を使わずに塔にも登ります</span></button>
      </div>
      <div class="times" role="radiogroup" aria-label="時間帯">
        <span class="tl">時間帯</span>
        <button class="time" type="button" role="radio" aria-checked="true" data-time="day">昼</button>
        <button class="time" type="button" role="radio" aria-checked="false" data-time="dusk">夕暮れ</button>
        <button class="time" type="button" role="radio" aria-checked="false" data-time="crescent">夜</button>
      </div>
      <label class="alt"><input type="checkbox" id="altRule" checked> 左右交互ルール <small>（オフにすると同じ足が続いても一歩になります）</small></label>
    </div>
    <div class="how">
      <span><kbd>J</kbd><kbd>K</kbd>で一歩ずつ（左足 J・右足 K。J か K を押してもスタート）</span>
      <span>ドラッグ / <kbd>←</kbd><kbd>→</kbd> で見回す</span>
      <span><kbd>M</kbd> 消音</span>
    </div>
    <button class="go" id="go" type="button" disabled>読み込み中…</button>
  </div>
</div>
<div id="err" hidden><p>このブラウザでは 3D 表示（WebGL）を使えないようです。別のブラウザでお試しください。</p></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= world shape (periodic along z → endless beach) ================= */
const PERIOD = 800, TAU = Math.PI * 2, KZ = TAU / PERIOD;
const wrapZ = dz => { dz = ((dz % PERIOD) + PERIOD) % PERIOD; return dz > PERIOD / 2 ? dz - PERIOD : dz; };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function shoreX(z) { return 4 * Math.sin(z * KZ * 6 + 1.3) + 2.2 * Math.sin(z * KZ * 14 + 0.4) + 0.8 * Math.sin(z * KZ * 34) + 2.5 * Math.sin(z * KZ * 3 + 0.7) + 1.2 * Math.sin(z * KZ * 11 + 2.1); }
function duneEdge(z) { return -24 + 3 * Math.sin(z * KZ * 10 + 2.0) + 1.5 * Math.sin(z * KZ * 26) + 2 * Math.sin(z * KZ * 5 + 1.0); }
// observation tower on the dunes (one per stretch of beach)
const TZ = -70, TX = shoreX(TZ) + duneEdge(TZ) - 10;
const TRAIL = { z: TZ + 22, x: shoreX(TZ + 22) - 9 };   // where the dune trail to the tower leaves the beach
const SP_R = 2.55, SP_TURNS = 0.9, SP_A0 = 0.35;    // spiral stair: walking radius, turns, start angle (0 = sea side)
const TOWER_E = { x: TX + 3.9 * Math.cos(SP_A0 - 0.3), z: TZ - 3.9 * Math.sin(SP_A0 - 0.3) };   // on the ground at the foot of the stair
const TOWER_M = { x: TX + SP_R * Math.cos(SP_A0), z: TZ - SP_R * Math.sin(SP_A0) };              // the first tread
const PARASOL = { z: -118, x: shoreX(-118) - 12 };      // white parasol and two loungers between the tower and the arch
function nearTower(x, z) {
  { const pz = wrapZ(z - PARASOL.z), px = x - PARASOL.x; if (px * px + pz * pz < 16) return true; }
  const dz = wrapZ(z - TZ), dx = x - TX;
  if (dx * dx + dz * dz < 81) return true;
  const segs = [[TOWER_E, TOWER_M], [TRAIL, TOWER_E]];
  for (const [a, b] of segs) {
    const ax = a.x, az = a.z, bx = b.x, bz = b.z, px = x, pz = TZ + dz;
    const t = Math.max(0, Math.min(1, ((px - ax) * (bx - ax) + (pz - az) * (bz - az)) / ((bx - ax) ** 2 + (bz - az) ** 2)));
    if (Math.hypot(px - (ax + (bx - ax) * t), pz - (az + (bz - az) * t)) < 2.6) return true;
  }
  return false;
}
function heightAt(x, z) {
  const d = x - shoreX(z);
  let h = d > 0 ? -1.9 * (1 - Math.exp(-d / 24)) : -d * 0.06;
  const dd = duneEdge(z) - d;                                  // >0 on the green dunes
  h += smooth(0, 12, dd) * (2.4 + 1.2 * Math.sin(z * KZ * 18 + x * 0.07) + 0.7 * Math.sin(z * KZ * 46 - x * 0.13) + 0.35 * Math.sin(z * KZ * 82 + x * 0.21));
  h += smooth(0, 70, dd) * dd * 0.05;
  h += 0.1 * Math.sin(x * 0.31 + z * KZ * 80) * Math.sin(z * KZ * 62 + 0.7) * smooth(-2, -10, d) * (1 - smooth(-2, 6, dd));
  h += 0.06 * Math.sin(z * KZ * 240) * Math.exp(-((d + 3) * (d + 3)) / 8);
  { const tz = wrapZ(z - TZ), tx = x - TX, r2 = tx * tx + tz * tz; h += 2.6 * Math.exp(-r2 / 70); } // rocky knoll under the tower
  return h;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash1 = n => { const s = Math.sin(n * 78.233) * 43758.5453; return s - Math.floor(s); };

/* ================= renderer / scene ================= */
const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('err').hidden = false; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.47;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.55, 0.72, 0.95), 0.00035);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 6000);
camera.rotation.order = 'YXZ';

// high tropical sun, behind-left of the walker so the scene is front-lit
const sunDir = new THREE.Vector3(-0.45, 0, 0.6).normalize();
const ELEV = THREE.MathUtils.degToRad(58);
sunDir.multiplyScalar(Math.cos(ELEV)); sunDir.y = Math.sin(ELEV); sunDir.normalize();

const moonDir = new THREE.Vector3(0.82, 0, -0.57).normalize();
const lightDir = sunDir.clone();          // the direction light comes from: the sun by day, the moon by night
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uSun: { value: sunDir.clone() }, uMoon: { value: moonDir.clone() }, uDay: { value: 1 }, uNight: { value: 0 },
    uPhase: { value: 0 }, uMoonGlow: { value: 1 }, uDusk: { value: 0 },
    uZen: { value: new THREE.Color(0.020 * 2.3, 0.13 * 2.3, 0.62 * 2.3) }, uMid: { value: new THREE.Color(0.08 * 2.1, 0.32 * 2.1, 0.92 * 2.1) }, uHor: { value: new THREE.Color(0.5 * 2, 0.72 * 2, 1.0 * 2) }
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position.z = gl_Position.w; }`,
  fragmentShader: `
    uniform vec3 uSun, uMoon, uZen, uMid, uHor; uniform float uDay, uNight, uPhase, uMoonGlow, uDusk; varying vec3 vDir;
    float sh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7)))*43758.5453); }
    float sh2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
    float sn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
      return mix(mix(sh2(i), sh2(i+vec2(1,0)), u.x), mix(sh2(i+vec2(0,1)), sh2(i+vec2(1,1)), u.x), u.y); }
    float sfbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a*sn(p); p = p*2.03 + 7.1; a *= 0.5; } return v; }
    float stars(vec3 d, float scale, float thr){
      vec3 p = d*scale, c = floor(p), f = fract(p) - 0.5;
      float h = sh(c); if (h < thr) return 0.0;
      vec3 o = vec3(sh(c + 1.3), sh(c + 2.7), sh(c + 5.1)) - 0.5;
      float b = (h - thr)/(1.0 - thr);
      return smoothstep(0.16, 0.0, length(f - o*0.5)) * (0.25 + 0.75*b*b);
    }
    void main(){
      vec3 d = normalize(vDir);
      float y = max(d.y, 0.0);
      vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.22, y));
      col = mix(col, uZen, smoothstep(0.18, 0.95, y));
      if (d.y < 0.0) col = uHor*0.95;
      // sun (day)
      float s = max(dot(d, uSun), 0.0);

function tileFBM(size, baseFreq, octaves, seed, gain = 0.5) {
  const out = new Float32Array(size * size), r = mulberry32(seed);
  let amp = 1, freq = baseFreq, tot = 0;
  for (let o = 0; o < octaves; o++) {
    const n = Math.min(freq, size), lat = new Float32Array(n * n);
    for (let i = 0; i < n * n; i++) lat[i] = r();

      for (let x = 0; x < size; x++) {
        const fx = x / size * n, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx), x0 = ix % n, x1 = (ix + 1) % n;
        const a = lat[y0 * n + x0], b = lat[y0 * n + x1], c = lat[y1 * n + x0], d = lat[y1 * n + x1];
        out[y * size + x] += amp * ((a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy);
      }
    }
    tot += amp; amp *= gain; freq *= 2;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}
function normalCanvas(H, size, strength) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const l = H[y * size + (x - 1 + size) % size], r = H[y * size + (x + 1) % size];
    const u = H[((y - 1 + size) % size) * size + x], d = H[((y + 1) % size) * size + x];
    let nx = (l - r) * strength, ny = (d - u) * strength, nz = 1;
    const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
    const k = (y * size + x) * 4;
    img.data[k] = (nx * .5 + .5) * 255; img.data[k + 1] = (ny * .5 + .5) * 255; img.data[k + 2] = (nz * .5 + .5) * 255; img.data[k + 3] = 255;

}

/* ================= chunked world ================= */
// The beach repeats every PERIOD metres. Everything is built once for one period, split into CH-metre
// chunks, and each frame only the chunks within a layer's range of the walker are shown (at the right
// multiple of PERIOD). The rest are hidden, and the visible ones are frustum-culled per chunk.
const CH = 50, NB = PERIOD / CH;
const baseZ = z => z - PERIOD * Math.floor((z + PERIOD) / PERIOD);        // → [-PERIOD, 0)
const chunkOf = z => Math.min(NB - 1, Math.max(0, Math.floor((baseZ(z) + PERIOD) / CH)));
const chunkRegistry = [];
function registerChunk(b, makeMesh, range) {
  const copies = Math.floor((2 * range + CH) / PERIOD) + 1, meshes = [];
  for (let c = 0; c < copies; c++) { const m = makeMesh(); m.visible = false; scene.add(m); meshes.push(m); }
  chunkRegistry.push({ b, meshes, range });
}
function updateChunks(pz) {
  for (const c of chunkRegistry) {
    const z0 = -PERIOD + c.b * CH, z1 = z0 + CH;
    const kMin = Math.ceil((pz - c.range - z1) / PERIOD), kMax = Math.floor((pz + c.range - z0) / PERIOD);
    let used = 0;
    for (let k = kMin; k <= kMax && used < c.meshes.length; k++) { const m = c.meshes[used++]; m.visible = true; m.position.z = k * PERIOD; }
    for (; used < c.meshes.length; used++) c.meshes[used].visible = false;
  }
}
class ChunkLayer {
  constructor(geo, mat, range, opts = {}) {

    this.lists = Array.from({ length: NB }, () => []);
    this.count = 0;
  }
  add(m4) {
    const m = m4.clone(), z = m.elements[14];
    m.elements[14] = baseZ(z);
    this.lists[chunkOf(z)].push(m); this.count++;
  }
  build() {
    this.lists.forEach((list, b) => {
      if (!list.length) return;
      const arr = new Float32Array(list.length * 16);
      list.forEach((m, i) => m.toArray(arr, i * 16));
      const attr = new THREE.InstancedBufferAttribute(arr, 16);
      registerChunk(b, () => {
        const im = new THREE.InstancedMesh(this.geo, this.mat, list.length);
        im.instanceMatrix = attr; im.castShadow = this.cast; im.receiveShadow = this.receive; im.renderOrder = this.order;
        im.computeBoundingSphere();
        return im;
      }, this.range);
    });
  }
}

      const nl = Math.hypot(nX, nY, nZ); nor[k * 3] = nX / nl; nor[k * 3 + 1] = nY / nl; nor[k * 3 + 2] = nZ / nl;

      const gcov = smooth(-2 + patch * 3, 6, dd);

}

function updateCreatures(dt) {
  updateTurtle(dt);
  // crabs (ghost crabs are busier at night)
  for (const c of crabs) {
    if (c.nightOnly && !isNight) { c.g.visible = false; continue; }
    const dx = c.x - player.x, dz = c.z - player.z, dist = Math.hypot(dx, dz);
    c.t += dt;
    if (c.state === 'idle') {
      c.idleT -= dt;
      if (c.idleT < 0) { c.state = 'shuffle'; c.t = 0; c.runDir = Math.random() < .5 ? -1 : 1; c.idleT = 1.5 + Math.random() * 4; }
      if (dist < 4.2) {
        c.state = 'run'; c.t = 0;
        const sideX = Math.cos(c.face), sideZ = -Math.sin(c.face);
        c.runDir = (sideX * dx + sideZ * dz) >= 0 ? 1 : -1;
        if (!c.seen) { c.seen = true; meet('crab', 'スナガニが横歩きで逃げていく'); }
      }
    }
    let speed = 0;
    if (c.state === 'shuffle') { speed = 0.25; if (c.t > 0.35) { c.state = 'idle'; } if (dist < 4.2) { c.state = 'idle'; c.idleT = 0; } }
    if (c.state === 'run') { speed = 1.9; if (c.t > 1.3 + Math.random() * 0.02) { c.state = 'burrow'; c.t = 0; } }
    if (c.state === 'burrow') { c.sink = Math.min(1, c.t / 0.7); if (c.t > 0.8) { c.state = 'gone'; c.t = 0; c.g.visible = false; } }
    if (c.state === 'gone' && c.t > 4) spawnCrab(c, false);
    if (speed > 0) {
      const sideX = Math.cos(c.face), sideZ = -Math.sin(c.face);
      c.x += sideX * c.runDir * speed * dt; c.z += sideZ * c.runDir * speed * dt;
      c.x = Math.min(c.x, shoreX(c.z) + 0.5);
      c.phase += dt * speed * 60;
      if (c.state === 'run') c.face += (Math.random() - .5) * dt * 0.8;
    }
    if (c.state !== 'gone') {
      c.g.position.set(c.x, heightAt(c.x, c.z) - c.sink * 0.14, c.z);
      c.g.rotation.y = c.face;
      for (const l of c.m.legs) {
        const ph = c.phase + l.i * Math.PI / 2 + (l.sx > 0 ? Math.PI : 0);
        l.pivot.rotation.y = l.baseY + (speed > 0 ? Math.sin(ph) * 0.3 : 0);
        l.pivot.rotation.z = speed > 0 ? Math.max(0, Math.cos(ph)) * 0.35 * l.sx : 0;
      }

    if (dist > 70 || (c.z - player.z) > 25) spawnCrab(c, false);
  }

  for (const b of plovers) {
    if (isNight) { b.g.visible = false; continue; }
    const dx = b.x - player.x, dz = b.z - player.z, dist = Math.hypot(dx, dz);
    b.t += dt;
    let run = 0;
    if (b.state === 'idle') {
      b.peck += dt;
      if (dist < 11 && !b.seen) { b.seen = true; meet('bird', 'シロチドリが波打ち際をちょこちょこ走る'); }
      if (dist < 7) { b.state = 'run'; b.t = 0; b.face = Math.atan2(-dx, -dz) + Math.PI + (Math.random() - .5) * 0.8; }
    }
    if (b.state === 'run') {
      run = 2.6;
      if (b.t > 1.4) { if (dist < 7.5) { b.state = 'fly'; b.t = 0; b.m.wings.forEach(w => w.pivot.visible = true); b.m.legs.forEach(l => l.visible = false); chirp('plover', panTo(b.x, b.z)); b.face += 0.8; } else { b.state = 'idle'; } }
    }
    if (b.state === 'fly') {
      const sp = 7;
      b.x += -Math.sin(b.face) * sp * dt; b.z += -Math.cos(b.face) * sp * dt; b.y += dt * 2.4;
      b.face += dt * 0.35;
      for (const w of b.m.wings) w.pivot.rotation.z = w.sx * Math.sin(b.t * 28) * 0.9;
      if (b.t > 7) spawnPlover(b, false);
    }
    if (run) { b.x += -Math.sin(b.face) * run * dt; b.z += -Math.cos(b.face) * run * dt; b.x = Math.min(b.x, shoreX(b.z) + 0.6); }
    if (b.state !== 'fly') b.y = 0;
    const gy = Math.max(heightAt(b.x, b.z), 0) + 0.11;
    b.g.position.set(b.x, gy + b.y + (run ? Math.abs(Math.sin(b.t * 30)) * 0.01 : 0), b.z);
    b.g.rotation.y = b.face;
    b.g.rotation.x = b.state === 'idle' ? Math.max(0, Math.sin(b.peck * 1.3)) > 0.93 ? 0.5 : 0 : 0;
    if (b.state !== 'fly' && (dist > 90 || (b.z - player.z) > 30)) spawnPlover(b, false);
  }
  // terns circling overhead
  for (const b of terns) {
    if (isNight) { b.g.visible = false; continue; }
    b.th += b.w * dt;
    const x = b.cx + Math.cos(b.th) * b.r, z = b.cz + Math.sin(b.th) * b.r, y = b.h + Math.sin(b.th * 2) * 1.5;

    if (b.glide < -1.6) b.glide = 1.5 + Math.random() * 2.5;

  for (const h of hermits) {
    const dx = h.x - player.x, dz = h.z - player.z, dist = Math.hypot(dx, dz);
    h.t += dt;
    if (dist < 5 && !h.seen) { h.seen = true; meet('hermit', 'ヤドカリが貝殻に引っ込んだ'); }

    let speed = 0;
    if (h.state === 'walk' && h.out > 0.9) {

      h.x += -Math.sin(h.face) * speed * dt; h.z += -Math.cos(h.face) * speed * dt;

      h.phase += dt * 14;
    }
    h.m.animal.scale.setScalar(Math.max(0.001, h.out));
    h.m.animal.position.z = -0.03 * h.out + 0.01;
    for (const l of h.m.legs) l.pivot.rotation.y = speed ? Math.sin(h.phase + l.i * Math.PI + (l.sx > 0 ? Math.PI / 2 : 0)) * 0.4 : 0;
    const bob = speed ? Math.abs(Math.sin(h.phase)) * 0.003 : 0;
    h.g.position.set(h.x, heightAt(h.x, h.z) + bob - (1 - h.out) * 0.012, h.z);

  }
  // flowers
  for (let i = 0; i < flowerSpots.length; i++) {
    const f = flowerSpots[i];
    const dz = wrapZ(f.z - player.z), dx = f.x - player.x;
    const key = i + ':' + Math.round((player.z + dz - f.z) / PERIOD);

  }
}

const modeBtns = [document.getElementById('modeNormal'), document.getElementById('modeAuto')], altBox = document.getElementById('altRule');
function setMode(m) { modeBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === m))); try { localStorage.setItem('nagisa.mode', m); } catch (e) {} }
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
altBox.addEventListener('change', () => { try { localStorage.setItem('nagisa.alt', altBox.checked ? '1' : '0'); } catch (e) {} });
try { const m = localStorage.getItem('nagisa.mode'); if (m) setMode(m); const a = localStorage.getItem('nagisa.alt'); if (a) altBox.checked = a === '1'; } catch (e) {}
function begin() {
  if (started) return;
  autoMode = modeBtns[1].getAttribute('aria-checked') === 'true'; altRule = altBox.checked;
  if (autoMode) { player.moveYaw = routeYaw(); }
  started = true; initAudio(); if (actx && actx.state === 'suspended') actx.resume();
  intro.classList.add('gone'); keyK.classList.add('next'); keyL.classList.add('next'); lastMoveT = performance.now();
}
go.addEventListener('click', begin);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= loop ================= */
const clock = new THREE.Clock();
let worldTime = 0;
const stepsEl = document.getElementById('steps'), distEl = document.getElementById('dist');
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  worldTime += dt;

  const turn = (keysHeld.ArrowRight ? 1 : 0) - (keysHeld.ArrowLeft ? 1 : 0);
  yawVel += (turn * 1.3 - yawVel) * Math.min(1, dt * 8);
  player.yaw -= yawVel * dt;

  let bob = 0, roll = 0;
  if (step) {
    step.t += dt / step.dur;
    const t = Math.min(1, step.t), e = t * t * (3 - 2 * t);
    if (step.path) {
      tower.s = step.s0 + (step.s1 - step.s0) * e;
      const q = pathAt(tower.s);
      player.x = q.x; player.z = q.z + tower.off; tower.y = q.y;
      if (step.offX !== undefined) { const k = 1 - e; player.x += step.offX * k; player.z += step.offZ * k; tower.y += step.offY * k; }
      const inside = tower.s > towerPath.sIn - 0.3 && tower.s < towerPath.sOut + 0.3;
      if (step.pano && autoMode && !(jet.active && jet.body.visible && jet.watchStart && worldTime - jet.watchStart < 30)) {   // deck march: step 1 faces the right end of the beach, steps 2-16 sweep one full circle
        if (step.pano === 1) {
          const fz = 200, want = Math.atan2(-(shoreX(player.z + fz) - player.x), -fz), d = Math.atan2(Math.sin(want - step.yaw0), Math.cos(want - step.yaw0));
          player.yaw = step.yaw0 + d * e;
        } else player.yaw += (TAU / 15) * (t - (step.prevT ?? 0));
        step.prevT = t;
      }
      if (!inside && !step.pano && Math.hypot(q.dx, q.dz) > 0.01) {          // face the way the steps go (not while marching on the deck)
        const sgn = step.s1 >= step.s0 ? 1 : -1, want = Math.atan2(-q.dx * sgn, -q.dz * sgn) - (autoMode && tower.mode === 'down' ? 0.4 : 0);   // auto: look a little to the right going down
        player.yaw += Math.atan2(Math.sin(want - player.yaw), Math.cos(want - player.yaw)) * Math.min(1, dt * 2.0);
      }
    } else { player.x = step.fx + (step.tx - step.fx) * e; player.z = step.fz + (step.tz - step.fz) * e; }
    const run = (STEP_DUR - step.dur) / (STEP_DUR - MIN_DUR);   // 0 = walking, 1 = jogging
    const amp = (reduceMotion ? 0.3 : 1) * (1 + 0.9 * run) * 0.5;   // screen shake halved
    bob = (0.032 * Math.sin(Math.PI * t) - 0.012) * amp;
    roll = (step.foot === 'k' ? 1 : -1) * 0.011 * Math.sin(Math.PI * t) * amp;
    if (step.t >= 1) {
      if (step.path) {
        if (tower.mode === 'up' && tower.s >= towerPath.total - 0.01) {
          tower.mode = 'top'; queued = null; tower.turn = !autoMode; tower.topSteps = 0;
          say(autoMode ? '展望台に着きました。足踏みを続けると、ぐるりと見わたしてからおります' : '展望台に着きました。ドラッグで見わたせます。J・K でおります', 5000);
        } else if (tower.mode === 'down' && tower.s <= 0.01) {
          tower.mode = 'free'; tower.cool = true; queued = null; tower.lookUp = 1.8; towerDone.add(Math.round((player.z - TZ) / PERIOD));
          say('塔の下におりました');      // keep the current view: no snap of the heading
        }
      }
      step = null; if (queued) { const q = queued; queued = null; startStep(q.foot, q.dur); }
    }
  }
  const wrap = dz => {
    player.z += dz; tower.off += dz; if (step) { step.fz += dz; step.tz += dz; }
    for (let i = 0; i < prints.length; i++) if (prints[i]) { prints[i].z += dz; writePrint(i); }
    printMesh.instanceMatrix.needsUpdate = true; shiftCreatures(dz);
  };
  if (player.z < -PERIOD) wrap(PERIOD); else if (player.z > PERIOD * 0.5) wrap(-PERIOD);

  {
    const free = !drag && performance.now() - lastDragT > 1500;
    const easeYaw = (want, k) => { player.yaw += Math.atan2(Math.sin(want - player.yaw), Math.cos(want - player.yaw)) * Math.min(1, dt * k); };
    const easePitch = (want, k) => { player.pitch += (want - player.pitch) * Math.min(1, dt * k); };
    // 足踏みモード: going down the spiral stair, look at your feet; afterwards lift the eyes again
    if (autoMode && tower.mode === 'down' && free) easePitch(0.78, 2.2);
    else if (autoMode && tower.mode === 'free' && tower.lookUp > 0) { tower.lookUp -= dt; if (free) easePitch(0.06, 2.0); }
    if (autoMode && started) {
      // 足踏みモード: when an airliner comes over, follow it with your eyes for about 30 seconds
      let gaze = null;
      if (jet.active && jet.body.visible && tower.mode !== 'up' && tower.mode !== 'down') {
        const wx = jet.body.position.x + jet.group.position.x, wz = jet.body.position.z + jet.group.position.z;
        const dx = wx - camera.position.x, dy = jet.alt - camera.position.y, dz = wz - camera.position.z;
        const hd = Math.hypot(dx, dz), elev = Math.atan2(dy, hd);
        if (!jet.watchStart && elev > 0.22 && hd < 4000) { jet.watchStart = worldTime; say('飛行機が飛んでいく'); }
        if (jet.watchStart && worldTime - jet.watchStart < 30) gaze = { yaw: Math.atan2(-dx, -dz), pitch: -Math.min(elev, 1.1) };
      }
      if (gaze && free) { easeYaw(gaze.yaw, 2.2); easePitch(gaze.pitch, 2.2); }
      else if (tower.mode === 'top') {   // on the deck: turn only while marching. step 1 faces the right end of the beach, steps 2-16 sweep one full circle
        if (free && step && step.pano) easePitch(0.1, 1.0);
      }
      else if (tower.mode === 'free' && free) {
        easeYaw(player.moveYaw ?? routeYaw(), 1.6);
        if (!(tower.lookUp > 0)) easePitch(0.06, 1.0);
      }
      if (tower.mode === 'free' && !step) player.moveYaw = routeYaw();
    }
  }
  if (tower.mode === 'top' && tower.turn) {
    const want = -Math.PI / 2, dYaw = Math.atan2(Math.sin(want - player.yaw), Math.cos(want - player.yaw));
    if (drag || Math.abs(dYaw) < 0.01) tower.turn = false; else player.yaw += dYaw * Math.min(1, dt * 1.5);
  }
  const targetEye = tower.mode !== 'free' ? tower.y + EYE : heightAt(player.x, player.z) + EYE;
  {
    const inWell = tower.mode === 'free' ? 0 : smooth(towerPath.sIn - 0.5, towerPath.sIn + 0.6, tower.s) * (1 - smooth(towerPath.sOut - 0.6, towerPath.sOut + 0.4, tower.s));
    stairEl.style.opacity = inWell.toFixed(3);
    stairText.textContent = tower.mode === 'down' ? '塔の中の階段をおりる' : '塔の中の階段をのぼる';
    const ez = TOWER_E.z + Math.round((player.z - TOWER_E.z) / PERIOD) * PERIOD, dE = Math.hypot(player.x - TOWER_E.x, player.z - ez);
    if (tower.cool && dE > 4) tower.cool = false;
    if (tower.mode === 'free' && started) {
      if (dE < 28 && !tower.hinted && !autoMode) { tower.hinted = true; say('丘の上に展望台「なぎさの塔」。らせん階段の下で階段のほうを向いて歩くと登れます', 5000); }
      if (dE > 60) tower.hinted = false;
    }
  }
  player.eyeY += (targetEye - player.eyeY) * Math.min(1, dt * (tower.mode === 'free' ? 10 : 6));
  const breathe = reduceMotion ? 0 : Math.sin(worldTime * 1.5) * 0.004;
  camera.position.set(player.x, player.eyeY + bob + breathe, player.z);
  camera.rotation.set(-player.pitch + (step ? -0.002 : 0), player.yaw, roll);

  const ws = waveState(worldTime);
  swashUniforms.uTime.value = worldTime; swashUniforms.uLevel.value = ws.level; swashUniforms.uFoamAmt.value = ws.foam;
  swashUniforms.uBand.value = ws.band; swashUniforms.uBandAmt.value = ws.bandAmt; swashUniforms.uCycle.value = ws.n;
  oceanMat.uniforms.uTime.value = worldTime;
  ocean.position.set(player.x, 0, player.z);
  let dirty = false;
  for (let i = 0; i < prints.length; i++) {
    const f = prints[i]; if (!f || !f.alive) continue;
    if (heightAt(f.x, f.z) < ws.level - 0.03) { f.alive = false; writePrint(i); dirty = true; }
  }
  if (dirty) printMesh.instanceMatrix.needsUpdate = true;

  updateCreatures(dt); updateFish(dt); updateJet(dt);
  flameMat.uniforms.uTime.value = worldTime;
  { const k = Math.round((player.z - TORCH.z) / PERIOD) * PERIOD, flick = 0.82 + 0.12 * Math.sin(worldTime * 11.3) + 0.08 * Math.sin(worldTime * 23.7 + 1.3);
    torchLight.position.set(TORCH.x, heightAt(TORCH.x, TORCH.z) + 1.95, TORCH.z + k);
    const lit = isNight || isDusk; torchLight.intensity = lit ? (isDusk ? 5 : 9) * flick : 0; flameMat.visible = lit; emberMat.emissiveIntensity = lit ? 0.8 : 0; }   // the torch is lit at dusk and at night
  if (isNight || isDusk) { const on = (worldTime % 2.0) < 1.2; towerLampMat.color.setRGB(on ? 6 : 0.6, on ? 0.35 : 0.04, on ? 0.2 : 0.02); towerGlowMat.opacity = on ? 0.35 : 0.04; }

  sunLight.position.set(player.x, 0, player.z).addScaledVector(lightDir, 150);
  sunLight.target.position.set(player.x, 0, player.z);
  sky.position.copy(camera.position);
  clouds.position.x = player.x; clouds.position.z = player.z;
  cloudMat.uniforms.uTime.value = worldTime; cloudMat.uniforms.uCam.value.copy(camera.position);
  windUniform.value = worldTime;

  if (actx) {
    scheduleWaves(); ambientBirds(dt);
    if (surfPan.pan) surfPan.pan.value = Math.cos(player.yaw) * 0.65;
    windGain.gain.value = 0.016 + 0.014 * (Math.sin(worldTime * 0.23) * 0.5 + 0.5) * (Math.sin(worldTime * 0.61 + 1) * 0.5 + 0.5);
  }

  stepsEl.textContent = stepCount;
  distEl.textContent = (stepCount * STRIDE).toFixed(1);
  if (!started) player.yaw = -0.18 + Math.sin(worldTime * 0.12) * 0.12;

  if (started && !step && performance.now() - lastMoveT > 5000) hudBottom.classList.add('idle');   // fade the keys after 5 s standing still
  updateChunks(player.z);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
go.disabled = false; go.textContent = '浜へ出る';
</script>
